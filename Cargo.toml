[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/server",
    "crates/parser",
]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
axum = "0.8"
dotenvy = "0.15"
thiserror = "2"
tokio-stream = "0.1"
futures-util = "0.3"
eventsource-stream = "0.2"
async-stream = "0.3"
schemars = "1"
jsonschema = { version = "0.61", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
rayon = "1"
ignore = "0.4"
blake3 = "1"
tiktoken-rs = "0.12"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ai-db = { path = "crates/db" }
ai-core = { path = "crates/core" }
ai-parser = { path = "crates/parser" }
