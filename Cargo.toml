[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
axum = "0.8"
dotenvy = "0.15"

ai-core = { path = "crates/core" }
