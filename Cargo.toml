[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
tokio = {version = "1", features = ["full"] }
serde = {version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

ai-core = {path = "crates/core"}
