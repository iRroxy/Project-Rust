services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ai_saas
      POSTGRES_PASSWORD: ai_saas_dev
      POSTGRES_DB: ai_saas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_saas -d ai_saas"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rust-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      APP_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://ai_saas:ai_saas_dev@postgres:5432/ai_saas
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      CORS_ALLOW_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  nextjs-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: "http://127.0.0.1:3000"
    ports:
      - "127.0.0.1:8080:3000"
    depends_on:
      - rust-server

volumes:
  postgres_data:
